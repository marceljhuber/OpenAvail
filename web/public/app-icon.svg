<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Raster source for apple-touch-icon.png / icon-192.png / icon-512.png.
    Unlike favicon.svg this one is deliberately opaque and single-look: iOS
    composites home-screen icons onto an unknown background and Android masks
    them to an arbitrary shape, so neither can carry a prefers-color-scheme rule.
    The mark sits inside the central ~55% so Android's maskable safe zone (a
    circle of 80% of the canvas) never clips it.
    Regenerate the PNGs with tools/make-icons.mjs — see its header.
  -->
  <rect width="512" height="512" fill="#136c46" />
  <g transform="translate(88 93.25) scale(10.5)">
    <rect x="9" y="2" width="3" height="7" rx="1.5" fill="#0b4a30" />
    <rect x="20" y="2" width="3" height="7" rx="1.5" fill="#0b4a30" />
    <rect x="3" y="6" width="26" height="23" rx="7" fill="#ffffff" />
    <path d="M3 13 A7 7 0 0 1 10 6 L22 6 A7 7 0 0 1 29 13 Z" fill="#20b26b" />
    <path
      d="M10.5 21 L14.5 25 L22 16.5"
      fill="none"
      stroke="#136c46"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
