<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab icons render against light or dark chrome, so carry both looks. -->
  <style>
    .page { fill: #ffffff; stroke: rgba(31, 38, 36, 0.16); }
    .hanger { fill: #1f2624; opacity: 0.55; }
    .accent { fill: #20b26b; }
    .tick { stroke: #20b26b; }
    @media (prefers-color-scheme: dark) {
      .page { fill: #1e2320; stroke: rgba(255, 255, 255, 0.16); }
      .hanger { fill: #e9ece8; opacity: 0.6; }
      .accent { fill: #2bbd77; }
      .tick { stroke: #2bbd77; }
    }
  </style>
  <rect class="hanger" x="9" y="2" width="3" height="7" rx="1.5" />
  <rect class="hanger" x="20" y="2" width="3" height="7" rx="1.5" />
  <rect class="page" x="3" y="6" width="26" height="23" rx="7" stroke-width="1.2" />
  <path class="accent" d="M3 13 A7 7 0 0 1 10 6 L22 6 A7 7 0 0 1 29 13 Z" />
  <path
    class="tick"
    d="M10.5 21 L14.5 25 L22 16.5"
    fill="none"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
